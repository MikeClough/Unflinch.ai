<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unflinch.ai</title>
  <meta name="robots" content="noindex">
  <style>
    :root{color-scheme:dark;--bg:#030509;--ink:#f6f8fb;--muted:#a9b5c6;--gold:#ffd166;--line:rgba(255,255,255,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 45%,rgba(136,239,255,.09),transparent 32rem),linear-gradient(180deg,#030509,#060912);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(520px,100%);border:1px solid var(--line);border-radius:24px;padding:28px;background:rgba(8,17,28,.82);box-shadow:0 30px 90px rgba(0,0,0,.45);text-align:center}
    h1{margin:0 0 12px;font-size:28px;letter-spacing:-.04em}
    p{margin:0 0 20px;color:var(--muted);line-height:1.5}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 18px;border-radius:15px;font-weight:800;text-decoration:none}
    .primary{color:#111008;background:linear-gradient(180deg,#ffeab0,var(--gold))}
    .secondary{color:var(--ink);border:1px solid var(--line)}
  </style>
</head>
<body>
  <main>
    <h1>Unflinch.ai</h1>
    <p>That page was not found. Open the homepage or go straight to the ChatGPT launch path.</p>
    <div class="actions">
      <a class="primary" href="/">Homepage</a>
      <a class="secondary" href="/gpt/">Open GPT</a>
    </div>
  </main>
</body>
</html>
